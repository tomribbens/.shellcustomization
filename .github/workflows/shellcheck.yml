name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest   # GitHub-hosted runner (shellcheck is preinstalled)
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck on the shell scripts
        run: shellcheck init.sh update.sh compress-screenlogs.sh setup_sudo_ssh_auth.sh
